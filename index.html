<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>masuj x</title>
    <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Rozmyte plamy w tle (Ambient) -->
    <div class="ambient-light light-1"></div>
    <div class="ambient-light light-2"></div>

    <div id="app">
        <header>
            <h1>masuj x</h1>
        </header>

        <!-- Ekran Logowania -->
        <div id="login-screen" class="panel fade-in glass">
            <h2>Podaj hasło</h2>
            <input type="password" id="password-input" placeholder="Hasło...">
            <button id="login-btn" class="glow-btn">Zaloguj</button>
            <p id="login-error" style="display: none;">Nieprawidłowe hasło</p>
        </div>

        <!-- Ekran Listy Wątków -->
        <div id="threads-screen" style="display: none;" class="fade-in">
            <div class="threads-header">
                <h2>Wątki</h2>
                <button id="show-new-thread-btn" class="icon-btn secondary-btn glass">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Nowy wątek
                </button>
            </div>

            <div id="new-thread-box" class="panel glass hidden">
                <input type="text" id="new-thread-title" class="dosis-text" placeholder="Tytuł wątku...">
                <textarea id="new-thread-desc" class="dosis-text" placeholder="Opis..." rows="2"></textarea>
                <div class="action-buttons">
                    <button id="cancel-thread-btn" class="secondary-btn">Anuluj</button>
                    <button id="create-thread-btn" class="glow-btn">Utwórz</button>
                </div>
            </div>

            <div id="threads-list"></div>
        </div>

        <!-- Ekran Wątku (Czat) -->
        <div id="chat-screen" style="display: none;" class="fade-in chat-container">
            
            <!-- Górny pasek z samym przyciskiem "Wróć" -->
            <div class="top-bar">
                <button id="back-btn" class="icon-btn secondary-btn glass">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    Wróć
                </button>
            </div>
            
            <!-- Lista postów, gdzie Tytuł i Opis lądują na samej górze -->
            <div id="posts-list"></div>
            
            <div id="typing-indicator" class="dosis-text hidden"></div>

            <div class="input-area panel glass relative">
                <div id="poll-creator" class="hidden">
                    <h4 style="margin-top:0; color:var(--accent);">Tworzenie ankiety</h4>
                    <input type="text" id="poll-question" class="dosis-text" placeholder="Pytanie...">
                    <input type="text" id="poll-opt1" class="dosis-text poll-opt" placeholder="Opcja 1 (wymagane)...">
                    <input type="text" id="poll-opt2" class="dosis-text poll-opt" placeholder="Opcja 2 (wymagane)...">
                    <input type="text" id="poll-opt3" class="dosis-text poll-opt" placeholder="Opcja 3 (opcjonalnie)...">
                    <input type="text" id="poll-opt4" class="dosis-text poll-opt" placeholder="Opcja 4 (opcjonalnie)...">
                    <div class="action-buttons" style="margin-bottom:15px;">
                        <button id="cancel-poll-btn" class="secondary-btn">Anuluj</button>
                    </div>
                </div>

                <div style="display:flex; gap:10px;">
                    <textarea id="new-post-content" class="dosis-text" placeholder="Napisz anonimowo..."></textarea>
                </div>
                
                <div class="action-buttons" style="margin-top:10px;">
                    <button id="toggle-poll-btn" class="icon-btn secondary-btn" style="width: auto;" title="Ankieta">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
                    </button>
                    <button id="send-post-btn" class="glow-btn">Wyślij</button>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
