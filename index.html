<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>masuj x</title>
    <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>masuj x 🛠️</h1>
        </header>

        <div id="login-screen" class="cartoon-box">
            <h2>Podaj tajne haslo!</h2>
            <input type="password" id="password-input" placeholder="Haslo...">
            <button id="login-btn">Wejdz</button>
            <p id="login-error" style="color: #ff4444; display: none; font-weight: bold;">Zle haslo!</p>
        </div>

        <div id="threads-screen" style="display: none;">
            <div class="cartoon-box new-thread-box">
                <h3>Stworz nowy watek</h3>
                <input type="text" id="new-thread-title" placeholder="Temat watku...">
                <input type="text" id="new-thread-desc" placeholder="Krotki opis / podtemat...">
                <button id="create-thread-btn">Dodaj watek!</button>
            </div>
            <div id="threads-list"></div>
        </div>

        <div id="chat-screen" style="display: none;" class="cartoon-box">
            <button id="back-btn">⬅ Wroc do listy</button>
            <h2 id="current-thread-title">Tytul</h2>
            <p id="current-thread-desc">Opis</p>
            
            <div id="posts-list"></div>

            <div class="input-area">
                <textarea id="new-post-content" placeholder="Napisz cos anonimowo..."></textarea>
                <button id="send-post-btn">Wyslij!</button>
            </div>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
